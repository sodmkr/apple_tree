<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>오늘의 사과 나무🪴</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
    <style>
        @font-face { font-family: 'TDTDCloudGothic'; src: url('TDTDCloudGothic.ttf'); }
        @font-face { font-family: 'TDTDNeon'; src: url('TDTDNeon.ttf'); }

        :root {
            --bg-color: #FDF5E6; --box-color: #F7EED3; --text-color: #333;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg-color); color: var(--text-color);
            font-family: 'TDTDNeon', sans-serif;
        }

        body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        /* 타이틀 폰트 크기 48px로 조정 및 위치 레이어 고정 */
        header { 
            text-align: center; 
            font-family: 'TDTDCloudGothic', sans-serif; 
            font-size: 48px; 
            font-weight: bold; 
            margin-bottom: 10px; 
            position: relative; 
            z-index: 50; 
        }

        /* 메인 나무 화면 */
        .tree-section { text-align: center; position: relative; cursor: pointer; z-index: 10; }
        .tree-container { position: relative; width: 360px; height: 420px; }
        .pot-img { width: 100%; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 5; }
        
        /* 나무 한가운데에 예쁘게 열릴 단 하나의 사과 스타일 */
        .apple-on-tree { position: absolute; font-size: 55px; z-index: 20; filter: drop-shadow(1px 1px 3px rgba(0,0,0,0.2)); line-height: 1; }

        /* 모달 (설정창) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--box-color); padding: 40px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .modal-label { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .modal-content input { width: 95%; border: none; border-bottom: 2px solid #aaa; background: transparent; margin-bottom: 25px; padding: 8px; font-size: 18px; font-family: 'TDTDNeon'; }
        .btn-row { display: flex; justify-content: flex-end; gap: 10px; }
        .btn { background: #fff; border: 1px solid #888; padding: 10px 25px; border-radius: 10px; cursor: pointer; font-size: 16px; }

        /* 상세 화면 (사과 채우기) */
        #detail-view { display: none; text-align: center; width: 100%; height: 100vh; background-color: var(--bg-color); position: fixed; top: 0; left: 0; z-index: 50; padding-top: 50px; box-sizing: border-box; }
        .detail-header-container { margin: 20px auto; padding-bottom: 20px; border-bottom: 2px solid #eee; width: 90%; max-width: 600px; }
        #detail-sub { font-size: 20px; color: #666; }
        .apple-row { display: flex; justify-content: center; gap: 20px; margin-top: 60px; flex-wrap: wrap; padding: 0 40px; }
        .apple-item { width: 80px; height: auto; cursor: pointer; transition: transform 0.1s ease; }
        .apple-item:active { transform: scale(0.9); }
        .back-btn { margin-top: 60px; cursor: pointer; text-decoration: underline; color: #666; font-size: 24px; display: inline-block; }
    </style>
</head>
<body onload="initApp()">

    <div id="home-view" style="text-align: center;">
        <header>오늘의 사과 나무 🌳</header>
        <div class="tree-section" onclick="handleTreeClick()">
            <div class="tree-container" id="tree-container">
                <img src="tree_pot.png" class="pot-img" onerror="this.src='https://via.placeholder.com/360x420?text=Tree+Image'">
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-label">오늘 할 일:</div>
            <input type="text" id="in-task" placeholder="예: 수학 문제집 풀기">
            <div class="modal-label">목표 사과 개수:</div>
            <input type="number" id="in-count" value="5" min="1" max="15">
            <div class="btn-row">
                <button class="btn" onclick="closeModal()">취소</button>
                <button class="btn" onclick="saveTask()">시작하기</button>
            </div>
        </div>
    </div>

    <div id="detail-view">
        <header>사과 채우기 📋</header>
        <div class="detail-header-container">
            <div id="detail-sub">사과를 터치해 빨갛게 익혀주세요!</div>
        </div>
        <div class="apple-row" id="apple-container"></div>
        <div class="back-btn" onclick="showHome()">나무 보러 가기</div>
    </div>

    <script>
        let todayData = null;
        // 나무 중앙 근처에 사과가 예쁘게 위치하도록 고정 좌표 잡음
        const singleApplePosition = {t: 110, l: 150};

        function initApp() {
            checkDailyReset();
            loadData();
        }

        function checkDailyReset() {
            const todayStr = new Date().toDateString();
            const lastSavedDay = localStorage.getItem('apple_saved_date');
            
            if (lastSavedDay !== todayStr) {
                localStorage.removeItem('today_apple_task');
                localStorage.setItem('apple_saved_date', todayStr);
            }
        }

        function loadData() {
            todayData = JSON.parse(localStorage.getItem('today_apple_task'));
            renderTree();
        }

        function saveData() {
            localStorage.setItem('today_apple_task', JSON.stringify(todayData));
            renderTree();
        }

        function renderTree() {
            const container = document.getElementById('tree-container');
            container.querySelectorAll('.apple-on-tree').forEach(a => a.remove());

            if (!todayData) return;

            // 상세 화면의 사과문자열 중 '0'(빈 사과)이 하나라도 있다면 미완성(초록사과 🍏)
            // '0'이 하나도 없고 전부 '1'로 채워졌다면 완성(빨간사과 🍎)
            const isComplete = !todayData.apples.includes('0');
            const fruitEmoji = isComplete ? '🍎' : '🍏';

            // 할 일이 등록되어 있다면 무조건 딱 '1개'만 나무 중심에 노출
            const appleEl = document.createElement('div');
            appleEl.className = 'apple-on-tree';
            appleEl.innerText = fruitEmoji;
            appleEl.style.top = singleApplePosition.t + 'px'; 
            appleEl.style.left = singleApplePosition.l + 'px';
            container.appendChild(appleEl);
        }

        function handleTreeClick() {
            if (!todayData) {
                openModal();
            } else {
                showDetail();
            }
        }

        function openModal() { document.getElementById('modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal').style.display = 'none'; }
        
        function saveTask() {
            const task = document.getElementById('in-task').value.trim();
            const count = parseInt(document.getElementById('in-count').value) || 5;
            
            if (!task) {
                alert("오늘 할 일을 입력해 주세요!");
                return;
            }

            todayData = {
                task: task,
                apples: '0'.repeat(Math.min(count, 15))
            };

            saveData();
            closeModal();
            showDetail();
            document.getElementById('in-task').value = '';
        }

        function showDetail() {
            if (!todayData) return;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';

            const container = document.getElementById('apple-container');
            container.innerHTML = '';

            todayData.apples.split('').forEach((state, i) => {
                const img = document.createElement('img');
                img.className = 'apple-item';
                img.src = state === '1' ? 'apple_red.png' : 'apple_line.png';
                
                img.onclick = () => {
                    let arr = todayData.apples.split('');
                    arr[i] = state === '0' ? '1' : '0';
                    todayData.apples = arr.join('');
                    saveData();
                    showDetail();
                };
                container.appendChild(img);
            });
        }

        function showHome() {
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
            renderTree();
        }
    </script>
</body>
</html>
